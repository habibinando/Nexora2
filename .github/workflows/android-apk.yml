name: Build Nexora2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.cpp'
      - '**.h'
      - '**.xml'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '.java-version'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
          cache-read-only: false

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android build components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/ndk/30.0.16248370"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
