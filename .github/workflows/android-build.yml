name: Android APK Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify JDK 25 and Gradle runtime
        shell: bash
        run: |
          set -euo pipefail
          java -version
          JAVA_MAJOR="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')"
          test "$JAVA_MAJOR" = "25" || { echo "::error::Expected JDK 25, got $JAVA_MAJOR"; exit 1; }
          # gradlew may not preserve its executable bit in a downloaded archive; invoke via bash.
          bash ./gradlew --version

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_TOOLS="$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$CMDLINE_TOOLS/sdkmanager"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install and verify required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

          # API 37 may be published as android-37.0 while AGP probes android-37.
          PLATFORM_DIR="$ANDROID_HOME/platforms/android-37.0"
          test -s "$PLATFORM_DIR/android.jar" || {
            echo "::error::SDK installer completed but platforms/android-37.0/android.jar is missing."
            find "$ANDROID_HOME/platforms" -maxdepth 2 -type f -name android.jar -print || true
            exit 1
          }
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$PLATFORM_DIR" "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          test -d "$ANDROID_HOME/ndk/30.0.16248370"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify packaged Vulkan SPIR-V shader
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            if ! unzip -Z1 "$apk" | grep -Fxq "assets/shaders/matmul.comp.spv"; then
              echo "::error::Vulkan shader assets/shaders/matmul.comp.spv missing from $apk"
              unzip -Z1 "$apk" | grep -E '(^|/)shaders/|\.spv        uses: actions/upload-artifact@v4
        with:
          name: Nexora2-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
 || true
              exit 1
            fi
            echo "Verified SPIR-V shader in $apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexora2-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
